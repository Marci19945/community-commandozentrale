<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin – Commando Zentrale</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="cc-data.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Courier New", monospace;
      background:
        linear-gradient(180deg, #0303ff 0%, #0301dc 45%, #000 100%);
      color: #fff;
      padding: 24px 16px 60px;
    }

    .wrap {
      max-width: 900px;
      margin: 0 auto;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 24px;
    }

    .logo {
      font-size: 30px;
      font-weight: 900;
      letter-spacing: 2px;
      color: #f4ba15;
      text-shadow:
        3px 3px 0 #e80709,
        6px 6px 0 #000;
    }

    .btn {
      display: inline-block;
      border: 3px solid #000;
      border-radius: 8px;
      padding: 10px 16px;
      font-family: inherit;
      font-size: 15px;
      font-weight: 900;
      text-transform: uppercase;
      cursor: pointer;
      text-decoration: none;
      box-shadow: 0 4px 0 #000;
    }

    .btn-red {
      background: #e80709;
      color: #fff;
    }

    .btn-yellow {
      background: #f4ba15;
      color: #000;
    }

    .btn-blue {
      background: #0303ff;
      color: #fff;
    }

    .btn-ghost {
      background: #111;
      color: #f4ba15;
      border-color: #f4ba15;
      box-shadow: none;
    }

    .notice {
      min-height: 22px;
      margin: 14px 0;
      font-weight: 900;
    }

    .notice.ok {
      color: #11ef11;
    }

    .notice.error {
      color: #e80709;
    }

    .card {
      background: #000;
      border: 4px solid #f4ba15;
      border-radius: 12px;
      box-shadow: 0 8px 0 #e80709;
      overflow: hidden;
      margin-bottom: 24px;
    }

    .card-head {
      padding: 14px 18px;
      background: #e80709;
      border-bottom: 4px solid #f4ba15;
      font-size: 20px;
      font-weight: 900;
      letter-spacing: 1px;
    }

    .card-body {
      padding: 18px;
    }

    label {
      display: block;
      margin: 14px 0 6px;
      font-weight: 900;
      color: #f4ba15;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    input,
    textarea {
      width: 100%;
      padding: 12px;
      border: 3px solid #f4ba15;
      border-radius: 8px;
      background: #0b0b0b;
      color: #fff;
      font-family: inherit;
      font-size: 15px;
    }

    textarea {
      min-height: 100px;
      resize: vertical;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 20px;
    }

    .stream-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 20px;
    }

    .stream-card {
      background: #000;
      border: 4px solid #0303ff;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 6px 0 #e80709;
    }

    .stream-media {
      height: 90px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #e80709, #f4ba15);
      font-size: 26px;
      font-weight: 900;
      color: #000;
      letter-spacing: 3px;
    }

    .stream-body {
      padding: 16px;
    }

    .badge {
      display: inline-block;
      margin-bottom: 10px;
      padding: 4px 10px;
      border: 2px solid #11ef11;
      border-radius: 999px;
      color: #11ef11;
      font-size: 12px;
      font-weight: 900;
      text-transform: uppercase;
    }

    .stream-body h3 {
      margin: 0 0 10px;
      color: #f4ba15;
      font-size: 20px;
    }

    .stream-body p {
      margin: 6px 0;
      color: #ddd;
      font-size: 14px;
    }

    .hidden {
      display: none !important;
    }

    @media (max-width: 640px) {
      .topbar {
        flex-direction: column;
        align-items: flex-start;
      }

      .logo {
        font-size: 24px;
      }
    }
  </style>
</head>

<body>
  <div class="wrap">

    <div class="topbar">
      <div class="logo">COMMANDO ZENTRALE</div>
      <button id="logout" class="btn btn-red hidden">Abmelden</button>
    </div>

    <div id="message" class="notice"></div>

    <button id="open" class="btn btn-yellow">Admin öffnen</button>

    <form id="login" class="card hidden">
      <div class="card-head">Anmelden</div>
      <div class="card-body">
        <label for="email">E-Mail</label>
        <input id="email" type="email" autocomplete="username" required>

        <label for="password">Passwort</label>
        <input id="password" type="password" autocomplete="current-password" required>

        <div class="actions">
          <button type="submit" class="btn btn-red">Anmelden</button>
        </div>
      </div>
    </form>

    <div id="editor" class="hidden">
      <form id="streamform" class="card">
        <div class="card-head">Stream eintragen</div>
        <div class="card-body">
          <label for="title">Titel</label>
          <input id="title" required>

          <label for="streamer">Streamer</label>
          <input id="streamer" required>

          <label for="starts">Termin</label>
          <input id="starts" type="datetime-local" required>

          <label for="url">Twitch-Link</label>
          <input id="url" type="url" required>

          <label for="description">Beschreibung</label>
          <textarea id="description"></textarea>

          <div class="actions">
            <button type="submit" class="btn btn-red">Speichern</button>
            <button type="button" id="reset" class="btn btn-yellow">Neuer Stream</button>
          </div>
        </div>
      </form>

      <h2 style="color:#f4ba15; letter-spacing:2px;">Geplante Streams</h2>
      <div id="records" class="stream-grid"></div>
    </div>

  </div>

  <script src="cc-admin.js"></script>
</body>
</html>
